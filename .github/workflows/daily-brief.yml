name: Daily AI Brief and Deploy

on:
  schedule:
    # 08:30 Beijing time every day.
    - cron: '30 0 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      max_news:
        description: 'Max news items to add this run'
        default: '3'
      max_research:
        description: 'Max research items to add this run'
        default: '1'
      backfill_from:
        description: 'Backfill start date YYYY-MM-DD (leave empty for a normal run)'
        default: ''
      backfill_to:
        description: 'Backfill end date YYYY-MM-DD'
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Update AI legal brief
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_BASE_URL: ${{ vars.ARK_BASE_URL || 'https://ark.cn-beijing.volces.com/api/coding/v3' }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          BRIEF_AI_MODEL: ${{ vars.BRIEF_AI_MODEL || 'ark-code-latest' }}
          MAX_NEWS: ${{ inputs.max_news || 3 }}
          MAX_RESEARCH: ${{ inputs.max_research || 1 }}
          BACKFILL_FROM: ${{ inputs.backfill_from }}
          BACKFILL_TO: ${{ inputs.backfill_to }}
          MIN_EXISTING_QUALITY: 7
        run: node scripts/update-brief-ai.mjs

      - name: Commit daily brief data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/brief_data.json
          git diff --cached --quiet || git commit -m "chore: update AI legal brief $(date -u +%Y-%m-%d)"
          git push

      # 旧站已迁至 juripulse.cn（2026-10-20）：GitHub Pages 只发布跳转页，每个旧页面跳到新站对应页面。
      # 简报数据仍由上面两步每天更新并提交，juripulse.cn 服务器从本仓库同步 public/data/brief_data.json。
      - name: Build redirect site
        run: node scripts/build-redirect-site.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: redirect-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
